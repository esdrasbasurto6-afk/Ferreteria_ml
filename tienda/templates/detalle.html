{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="bg-light p-5 text-center rounded border">
                <span style="font-size: 8rem;">🛠️</span>
            </div>
        </div>

        <div class="col-md-6">
            <h2 class="fw-bold">{{ producto.nombre }}</h2>
            
            <span class="badge bg-secondary mb-3 fs-6">Categoría: {{ producto.categoria.nombre }}</span>
            
            <h3 class="text-primary fw-bold">${{ producto.precio }}</h3>
            
            <p class="mt-4 fs-5">{{ producto.descripcion }}</p>
            
            <p class="text-muted"><strong>Disponibles en inventario:</strong> {{ producto.stock }} unidades</p>

            <hr>

            <div class="d-grid gap-2 d-md-block mt-4">
                <a href="{% url 'agregar_carrito' producto.id %}" class="btn btn-success btn-lg shadow">
                    🛒 Añadir a la cesta
                </a>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-dark btn-lg shadow">
                    ⬅️ Volver a la tienda
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
