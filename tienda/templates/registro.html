{% extends "base.html" %}

{% block content %}

<h2 class="text-2xl font-bold text-gray-700 mb-6 text-center">
    Crear Cuenta
</h2>

<form method="POST" class="max-w-md mx-auto">
    {% csrf_token %}

    <div class="mb-4">
        <label class="block text-gray-600 mb-1">Usuario</label>
        <input type="text" name="username"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-600 mb-1">Correo</label>
        <input type="email" name="email"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-600 mb-1">Contraseña</label>
        <input type="password" name="password"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               required>
    </div>

    <div class="mb-6">
        <label class="block text-gray-600 mb-1">Confirmar contraseña</label>
        <input type="password" name="password2"
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               required>
    </div>

    <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition shadow-md">
        Registrarse
    </button>

</form>

{% endblock %}
