<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ferretería ML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

    <nav class="bg-gradient-to-r from-blue-600 to-blue-800 shadow-lg">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            
            <a href="{% url 'dashboard' %}" class="text-white text-xl font-bold tracking-wide hover:text-gray-200">
                🔧 Ferretería ML
            </a>

            <div class="flex items-center space-x-4 md:space-x-6">
                <a href="{% url 'dashboard' %}" class="text-white hover:text-gray-200 font-medium transition">
                    Inicio
                </a>
                
                {% if user.is_authenticated %}
                    
                    <a href="{% url 'carrito' %}" class="text-white hover:text-gray-200 font-medium transition">
                        Carrito 🛒
                    </a>
                    
                    <a href="{% url 'analytics' %}" class="text-white hover:text-gray-200 font-medium transition">
                        Analíticas 📊
                    </a>

                    <div class="border-l border-blue-400 pl-4 flex items-center space-x-4">
                        <span class="text-blue-100 text-sm">
                            Hola, <strong class="text-white text-base">{{ user.username }}</strong>
                        </span>
                        
                        <a href="{% url 'logout' %}" class="bg-red-500 text-white px-3 py-2 rounded-lg shadow hover:bg-red-600 transition text-sm font-medium">
                            Salir
                        </a>
                    </div>

                {% else %}
                    
                    <a href="{% url 'login' %}" class="text-white hover:text-gray-200 font-medium transition">
                        Iniciar Sesión
                    </a>
                    <a href="{% url 'registro' %}" class="bg-white text-blue-700 px-4 py-2 rounded-lg shadow hover:bg-gray-200 transition font-medium">
                        Registro
                    </a>
                    
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-6 py-8">
        <div class="bg-white rounded-2xl shadow-lg p-6">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="bg-gray-800 text-white text-center py-4 mt-6">
        <p class="text-sm">© 2026 Ferretería ML - Sistema Inteligente</p>
    </footer>

</body>
</html>
